apiVersion: v1
kind: Secret
metadata:
  name: hutao-pet-secrets
  namespace: hutao-pet
type: Opaque
data:
  # 占位符：部署前必须替换为真实值（Base64 编码）
  #   echo -n '<YOUR_DEEPSEEK_API_KEY>' | base64
  DEEPSEEK_API_KEY: "<BASE64_YOUR_DEEPSEEK_API_KEY>"
  DB_PASSWORD: "<BASE64_YOUR_DB_PASSWORD>"
  JWT_SECRET: "<BASE64_YOUR_JWT_SECRET>"
