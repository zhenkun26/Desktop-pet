apiVersion: apps/v1
kind: Deployment
metadata:
  name: hutao-pet-api
  namespace: hutao-pet
  labels:
    app: hutao-pet-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hutao-pet-api
  template:
    metadata:
      labels:
        app: hutao-pet-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: api
          image: <YOUR_REGISTRY>/hutao-pet-api:<YOUR_IMAGE_TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hutao-pet-config
            - secretRef:
                name: hutao-pet-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
